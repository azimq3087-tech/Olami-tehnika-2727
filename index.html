<!DOCTYPE html>
<html lang="tg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Olami Tehnika 2727</title>
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; margin: 0; background: #f4f7f6; color: #333; scroll-behavior: smooth; padding-bottom: 100px; }
        .top-promo { background: #ff9900; color: #232f3e; text-align: center; padding: 8px; font-weight: bold; font-size: 13px; position: sticky; top: 0; z-index: 1001; }
        header { background: #232f3e; color: white; padding: 20px; text-align: center; font-size: 26px; font-weight: bold; }
        .nav-menu { background: #37475a; display: flex; justify-content: center; padding: 10px; gap: 15px; position: sticky; top: 31px; z-index: 1000; overflow-x: auto; }
        .nav-menu a { color: white; text-decoration: none; font-size: 12px; font-weight: bold; text-transform: uppercase; white-space: nowrap; }
        
        .product-grid { display: flex; flex-wrap: wrap; justify-content: center; gap: 15px; padding: 15px; }
        .product-card { background: white; border-radius: 12px; width: 100%; max-width: 300px; padding: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); text-align: center; display: flex; flex-direction: column; transition: 0.3s; }
        .product-card:hover { transform: translateY(-5px); }

        .main-img { width: 100%; height: 180px; object-fit: contain; border-radius: 8px; }
        .thumbnails { display: flex; justify-content: center; gap: 5px; margin: 10px 0; overflow-x: auto; padding-bottom: 5px; }
        .thumbnails img { width: 45px; height: 35px; cursor: pointer; border: 1px solid #ddd; border-radius: 4px; object-fit: cover; }
        
        .title { font-size: 16px; font-weight: bold; margin: 10px 0; min-height: 40px; line-height: 1.2; }
        .price { font-size: 20px; color: #b12704; font-weight: bold; }
        
        .btn-info { background: #f0f2f2; border: 1px solid #adb1b8; padding: 10px; border-radius: 8px; cursor: pointer; margin-bottom: 8px; font-weight: bold; }
        .btn-cart { background: #25d366; color: white; border: none; padding: 12px; border-radius: 8px; font-weight: bold; cursor: pointer; }
        
        .specs { display: none; text-align: left; background: #f9f9f9; padding: 10px; border-radius: 8px; font-size: 12px; border-left: 4px solid #ff9900; margin-bottom: 10px; }
        
        /* Корзина */
        .cart-panel { position: fixed; bottom: 85px; right: 20px; background: white; width: 280px; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.3); z-index: 2000; padding: 15px; display: none; border: 2px solid #232f3e; }
        .cart-items { max-height: 200px; overflow-y: auto; margin-bottom: 10px; }
        .cart-item { display: flex; justify-content: space-between; font-size: 13px; padding: 5px 0; border-bottom: 1px solid #eee; }
        .cart-total { font-weight: bold; color: #b12704; margin-top: 10px; }
        .btn-checkout { background: #ff9900; color: #232f3e; width: 100%; border: none; padding: 12px; border-radius: 8px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        
        .call-fixed { position: fixed; bottom: 20px; right: 20px; background: #007bff; color: white; width: 55px; height: 55px; border-radius: 50%; display: flex; align-items: center; justify-content: center; text-decoration: none; z-index: 2000; font-size: 24px; }
    </style>
</head>
<body>
<div class="top-promo">🚚 Доставкаи РОЙГОН дар дохили ноҳия! 🎁</div>
<header>Olami Tehnika 2727</header>
<nav class="nav-menu">
    <a href="#conditioners">Кондисионерҳо</a>
    <a href="#tvs">Телевизорҳо</a>
    <a href="#washing">Мошинҳо</a>
</nav>
<div class="product-grid">    <div class="product-card" id="conditioners">
        <img src="gre1.jpg" id="vGree" class="main-img">
        <div class="title">Gree Pular Inverter</div>
        <p class="price">4600 смн</p>
        <button class="btn-info" onclick="toggle('sGree')">Характеристика</button>
        <div id="sGree" class="specs">Намуд: Inverter, Сардӣ / Гармӣ</div>
        <button class="btn-cart" onclick="addToCart('Gree Pular Inverter', 4600)">🛒 Ба сабад</button>
    </div>

    </div>

<div id="cartPanel" class="cart-panel">
    <div style="display:flex; justify-content:space-between"><b>Сабад</b> <span onclick="document.getElementById('cartPanel').style.display='none'" style="cursor:pointer">✖</span></div>
    <div id="cartItems" class="cart-items"></div>
    <div class="cart-total">Ҷамъ: <span id="totalPrice">0</span> смн</div>
    <button class="btn-checkout" onclick="checkout()">📲 Фармоиш дар WhatsApp</button>
</div>

<a href="tel:+992935412727" class="call-fixed">📞</a>

<script>
    let cart = [];
    function addToCart(name, price) {
        cart.push({ name: name, price: price });
        updateCartUI();
        document.getElementById('cartPanel').style.display = 'block';
    }
    function updateCartUI() {
        const itemsDiv = document.getElementById('cartItems');
        const totalSpan = document.getElementById('totalPrice');
        itemsDiv.innerHTML = '';
        let total = 0;
        cart.forEach((item) => {
            total += item.price;
            itemsDiv.innerHTML += `<div class="cart-item"><span>${item.name}</span><b>${item.price}с.</b></div>`;
        });
        totalSpan.innerText = total;
    }
    function checkout() {
        const phone = "992935412727";
        let msg = "Салом! Фармоиши ман:\n";
        cart.forEach((item, i) => msg += `${i+1}. ${item.name} - ${item.price}смн\n`);
        msg += "\nҶамъ: " + document.getElementById('totalPrice').innerText + " смн";
        window.open(`https://wa.me/${phone}?text=${encodeURIComponent(msg)}`, '_blank');
    }
    function toggle(id) {
        let e = document.getElementById(id);
        e.style.display = (e.style.display === 'block') ? 'none' : 'block';
    }
</script>
</body>
</html>
