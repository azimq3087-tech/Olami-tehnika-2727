<!DOCTYPE html>
<html lang="tg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Olami Tehnika 2727</title>
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; margin: 0; background: #f4f7f6; color: #333; scroll-behavior: smooth; padding-bottom: 100px; }
        .top-promo { background: #ff9900; color: #232f3e; text-align: center; padding: 8px; font-weight: bold; font-size: 13px; position: sticky; top: 0; z-index: 1001; }
        header { background: #232f3e; color: white; padding: 20px; text-align: center; font-size: 26px; font-weight: bold; }
        .nav-menu { background: #37475a; display: flex; justify-content: center; padding: 10px; gap: 15px; position: sticky; top: 31px; z-index: 1000; overflow-x: auto; }
        .nav-menu a { color: white; text-decoration: none; font-size: 12px; font-weight: bold; text-transform: uppercase; white-space: nowrap; }
        
        .product-grid { display: flex; flex-wrap: wrap; justify-content: center; gap: 15px; padding: 15px; }
        .product-card { background: white; border-radius: 12px; width: 100%; max-width: 300px; padding: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); text-align: center; display: flex; flex-direction: column; transition: 0.3s; }
        .product-card:hover { transform: translateY(-5px); }

        .main-img { width: 100%; height: 180px; object-fit: contain; border-radius: 8px; cursor: zoom-in; }
        .thumbnails { display: flex; justify-content: center; gap: 5px; margin: 10px 0; overflow-x: auto; padding-bottom: 5px; }
        .thumbnails img { width: 45px; height: 35px; cursor: pointer; border: 1px solid #ddd; border-radius: 4px; object-fit: cover; }

        .title { font-size: 16px; font-weight: bold; margin: 10px 0; min-height: 40px; line-height: 1.2; color: #111; }
        .price { font-size: 20px; color: #b12704; font-weight: bold; margin-bottom: 5px; }
        
        .button-group { display: flex; flex-direction: column; gap: 8px; margin-top: auto; }
        .btn-info { background: #f0f2f2; border: 1px solid #adb1b8; padding: 10px; border-radius: 8px; cursor: pointer; font-weight: bold; }
        .btn-cart { background: #25d366; color: white; border: none; padding: 12px; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 14px; }

        .specs { display: none; text-align: left; background: #f9f9f9; padding: 10px; border-radius: 8px; font-size: 12px; border-left: 4px solid #ff9900; margin-top: 10px; }
        .spec-line { border-bottom: 1px dashed #ddd; padding: 4px 0; }

        /* --- СТИЛИ ГАЛЕРЕИ --- */
        .fullscreen-overlay {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.95); z-index: 3000; justify-content: center; align-items: center;
        }
        .fullscreen-overlay img { max-width: 95%; max-height: 80%; object-fit: contain; border-radius: 5px; }
        .close-fs { position: absolute; top: 20px; right: 25px; color: white; font-size: 40px; cursor: pointer; }
        .nav-fs { position: absolute; top: 50%; color: white; font-size: 50px; cursor: pointer; user-select: none; padding: 20px; transition: 0.3s; }
        .nav-fs:hover { color: #ff9900; }
        .prev-fs { left: 10px; }
        .next-fs { right: 10px; }

        .cart-panel { position: fixed; bottom: 85px; right: 20px; background: white; width: 280px; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.3); z-index: 2000; padding: 15px; display: none; border: 2px solid #232f3e; }
        .cart-total { font-weight: bold; font-size: 16px; border-top: 2px solid #eee; padding-top: 10px; color: #b12704; margin-top: 10px; }
        .btn-checkout { background: #ff9900; color: #232f3e; width: 100%; border: none; padding: 12px; border-radius: 8px; font-weight: bold; margin-top: 10px; cursor: pointer; }
        .call-fixed { position: fixed; bottom: 20px; right: 20px; background: #007bff; color: white; width: 55px; height: 55px; border-radius: 50%; display: flex; align-items: center; justify-content: center; text-decoration: none; z-index: 2000; font-size: 24px; }
    </style>
</head>
<body>

<div class="top-promo">🚚 Доставкаи РОЙГОН дар дохили ноҳия! 🎁</div>

        <div class="title">Android TV 46" Smart</div>
        <p class="price">2800 смн</p>
        <button class="btn-cart" onclick="addToCart('Android TV 46', 2800)">🛒 Ба сабад</button>

        <img src="samsung1.jpg" id="vSam" class="main-img" onclick="openGallery('vSam')">
        <div class="title">Samsung Smart TV 35"</div>
        <p class="price">2100 смн</p>
