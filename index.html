<section id="products" class="products">
    <div class="product-grid">

        <div class="product-card">
            <img src="samsung1.jpg" id="view-samsung" class="main-img" alt="Samsyng">
            <div class="thumbnails">
                <img src="samsung1.jpg" onclick="document.getElementById('view-samsung').src='samsung1.jpg'">
                <img src="samsung2.jpg" onclick="document.getElementById('view-samsung').src='samsung2.jpg'">
                <img src="samsung3.jpg" onclick="document.getElementById('view-samsung').src='samsung3.jpg'">
            </div>
            <h3>Samsyng LED TV 35"</h3>
            <p class="price">2100 смн</p>
            <div class="btn-box">
                <button class="btn-info" onclick="toggleSpecs('specs-samsung')">Характеристики</button>
                <div id="specs-samsung" class="specs">
                    • 35 дюймов, HD LED TV<br>
                    • Bluetooth, Miracast<br>
                    • USB Support, DVB-T2/S2
                </div>
                <button class="btn-cart">🛒 В корзину</button>
                <a href="https://wa.me/992XXXXXXXXX" class="btn-wa">📞 Связаться</a>
            </div>
        </div>

        <div class="product-card">
            <img src="lg1.jpg" id="view-lg" class="main-img" alt="LG TV">
            <div class="thumbnails">
                <img src="lg1.jpg" onclick="document.getElementById('view-lg').src='lg1.jpg'">
                <img src="lg2..jpg" onclick="document.getElementById('view-lg').src='lg2..jpg'">
                <img src="lg3.jpg" onclick="document.getElementById('view-lg').src='lg3.jpg'">
            </div>
            <h3>LG 43LP50 (43")</h3>
            <p class="price">1850 смн</p>
            <div class="btn-box">
                <button class="btn-info" onclick="toggleSpecs('specs-lg')">Характеристики</button>
                <div id="specs-lg" class="specs">
                    • 43 дюйма, Full HD<br>
                    • Dolby Audio<br>
                    • HDMI / USB Movie
                </div>
                <button class="btn-cart">🛒 В корзину</button>
                <a href="https://wa.me/992559611114" class="btn-wa">📞 Связаться</a>
            </div>
        </div>

    </div>
</section>

<script>
    function toggleSpecs(id) {
        var s = document.getElementById(id);
        s.style.display = (s.style.display === 'block') ? 'none' : 'block';
    }
</script>
