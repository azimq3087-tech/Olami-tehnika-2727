<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Olami Tehnika 2727</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; background-color: #f4f4f4; }
        .product-grid { display: flex; flex-wrap: wrap; justify-content: center; gap: 20px; padding: 20px; }
        
        /* Карточка товара */
        .product-card { 
            background: white; 
            border-radius: 15px; 
            width: 100%; 
            max-width: 350px; 
            padding: 20px; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.1); 
            box-sizing: border-box;
            text-align: center;
        }

        .main-img { width: 100%; height: 200px; object-fit: contain; border-radius: 10px; }
        
        /* Миниатюры */
        .thumbnails { display: flex; justify-content: center; gap: 8px; margin: 15px 0; }
        .thumbnails img { width: 60px; height: 45px; cursor: pointer; border: 1px solid #ddd; border-radius: 5px; object-fit: cover; }
        .thumbnails img:hover { border-color: #ff9900; }

        .price { font-size: 24px; color: #27ae60; font-weight: bold; margin: 10px 0; }

        /* Кнопки */
        .button-group { display: flex; flex-direction: column; gap: 10px; margin-top: 15px; }
        
        button, .btn-link { 
            padding: 12px; border: none; border-radius: 8px; font-weight: bold; 
            cursor: pointer; text-decoration: none; font-size: 16px; 
        }

        .btn-info { background: #f0f0f0; color: #333; }
        .btn-cart { background: #ff9900; color: white; }
        .btn-wa { background: #25d366; color: white; }

        /* Скрытые характеристики */
        .specs { display: none; text-align: left; background: #f9f9f9; padding: 15px; border-radius: 8px; margin-top: 10px; font-size: 14px; }
    </style>
</head>
<body>

<div class="product-grid">

    <div class="product-card">
        <img src="samsung1.jpg" id="img-samsung" class="main-img" alt="Samsyng">
        <div class="thumbnails">
            <img src="samsung1.jpg" onclick="document.getElementById('img-samsung').src='samsung1.jpg'">
            <img src="samsung2.jpg" onclick="document.getElementById('img-samsung').src='samsung2.jpg'">
            <img src="samsung3.jpg" onclick="document.getElementById('img-samsung').src='samsung3.jpg'">
        </div>
        <h3>Samsyng LED TV 35"</h3>
        <p class="price">2100 смн</p>
        <div class="button-group">
            <button class="btn-info" onclick="toggleSpecs('specs-samsung')">📋 Характеристики</button>
            <div id="specs-samsung" class="specs">
                • 35 дюймов, HD LED<br>
                • Bluetooth / Miracast<br>
                • USB Movie / DVB-T2
            </div>
            <button class="btn-cart">🛒 В корзину</button>
            <a href="https://wa.me/992XXXXXXXXX" class="btn-link btn-wa">📞 Заказать в WhatsApp</a>
        </div>
    </div>

    <div class="product-card">
        <img src="lg1.jpg" id="img-lg" class="main-img" alt="LG">
        <div class="thumbnails">
            <img src="lg1.jpg" onclick="document.getElementById('img-lg').src='lg1.jpg'">
            <img src="lg2..jpg" onclick="document.getElementById('img-lg').src='lg2..jpg'">
            <img src="lg3.jpg" onclick="document.getElementById('img-lg').src='lg3.jpg'">
        </div>
        <h3>LG 43LP50 (43")</h3>
        <p class="price">1850 смн</p>
        <div class="button-group">
            <button class="btn-info" onclick="toggleSpecs('specs-lg')">📋 Характеристики</button>
            <div id="specs-lg" class="specs">
                • 43 дюйма, Full HD<br>
                • Dolby Audio<br>
                • HDMI / USB Movie
            </div>
            <button class="btn-cart">🛒 В корзину</button>
            <a href="https://wa.me/992559611114" class="btn-link btn-wa">📞 Заказать в WhatsApp</a>
        </div>
    </div>

</div>

<script>
    function toggleSpecs(id) {
        var el = document.getElementById(id);
        el.style.display = (el.style.display === 'block') ? 'none' : 'block';
    }
</script>

</body>
</html>
